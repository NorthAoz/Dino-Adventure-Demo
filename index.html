<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18251b;color:white;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px}h1{margin:4px 0 10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}button{background:#e7a82d;border:0;border-radius:9px;padding:9px 13px;font-weight:bold;cursor:pointer}
#game{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(#86c8e8 0 48%,#69a84f 48%);border:4px solid #263b26;border-radius:15px;overflow:hidden}.cloud,.tree,.rock{position:absolute}.cloud{font-size:42px;opacity:.7}.tree{font-size:58px}.rock{font-size:38px}#player,#dino{position:absolute;transform:translate(-50%,-50%);font-size:44px}#player{z-index:5}#dino{z-index:4;cursor:pointer}.panel{margin-top:12px;background:#222c23;border-radius:13px;padding:12px}.stats{display:flex;gap:18px;flex-wrap:wrap}
#battle{display:none;position:absolute;inset:0;background:rgba(15,18,12,.96);z-index:20;padding:18px}.battlebox{max-width:760px;margin:4% auto;background:#29362a;border:2px solid #778c65;border-radius:16px;padding:18px}.fighters{display:flex;justify-content:space-around;align-items:center;text-align:center;font-size:18px}.fighter{font-size:70px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.bar{height:14px;background:#111;border-radius:9px;overflow:hidden}.fill{height:100%;width:100%;background:#55b85a}#msg{min-height:28px;margin-top:8px;text-align:center}.help{opacity:.8;font-size:13px}.key{display:inline-block;background:#111;padding:2px 6px;border-radius:5px}
</style></head><body><div class="wrap"><div class="top"><h1>🦖 Dino Adventure</h1><button onclick="resetGame()">เริ่มเกมใหม่</button></div>
<div id="game"><div class="cloud" style="left:10%;top:7%">☁️</div><div class="cloud" style="left:67%;top:12%">☁️</div><div class="tree" style="left:8%;top:45%">🌳</div><div class="tree" style="left:84%;top:42%">🌲</div><div class="rock" style="left:28%;top:68%">🪨</div><div class="rock" style="left:73%;top:70%">🪨</div>
<div id="player">🧑</div><div id="dino">🦖</div><div id="battle"><div class="battlebox"><div class="fighters"><div>🦖 ไดโนป่า<div class="bar"><div id="efill" class="fill"></div></div><b id="ehp">30</b> HP</div><div class="fighter">⚔️</div><div>🦖 ไดโนของคุณ<div class="bar"><div id="pfill" class="fill"></div></div><b id="php">30</b> HP</div></div>
<div id="msg">เลือกการกระทำ</div><div class="actions"><button onclick="attack()">⚔️ โจมตี</button><button onclick="feed()">🍖 ใช้อาหาร</button><button onclick="capture()">🪤 จับ</button><button onclick="runAway()">🏃 หนี</button></div></div></div></div>
<div class="panel"><div class="stats"><b>👤 นักสำรวจ Lv.1</b><b>🦖 ไดโนที่เลี้ยง: <span id="owned">0</span></b><b>🪤 กับดัก: <span id="trap">3</span></b><b>🍖 อาหาร: <span id="food">5</span></b></div><p class="help">เดินด้วย <span class="key">W A S D</span> หรือปุ่มลูกศร • เดินเข้าใกล้ 🦖 เพื่อเริ่มต่อสู้ • ลด HP แล้วลองจับมัน</p></div></div>
<script>
const player={x:50,y:78,speed:2.2},wild={x:66,y:55};let inBattle=false,php=30,ehp=30,traps=3,food=5,owned=0;
const $=id=>document.getElementById(id);function pos(e,x,y){e.style.left=x+"%";e.style.top=y+"%"}function render(){pos($("player"),player.x,player.y);pos($("dino"),wild.x,wild.y);$("owned").textContent=owned;$("trap").textContent=traps;$("food").textContent=food}
function resetGame(){Object.assign(player,{x:50,y:78});Object.assign(wild,{x:66,y:55});inBattle=false;php=30;ehp=30;traps=3;food=5;owned=0;$("battle").style.display="none";render()}
function dist(){return Math.hypot(player.x-wild.x,player.y-wild.y)}function startBattle(){if(inBattle)return;inBattle=true;php=30;ehp=30;$("battle").style.display="block";$("msg").textContent="ไดโนเสาร์ป่าปรากฏตัว!";updateBattle()}
function updateBattle(){$("php").textContent=Math.max(0,php);$("ehp").textContent=Math.max(0,ehp);$("pfill").style.width=(php/30*100)+"%";$("efill").style.width=(ehp/30*100)+"%"}
function enemyTurn(){if(ehp<=0)return;php-=Math.floor(Math.random()*5)+3;updateBattle();if(php<=0)$("msg").textContent="ไดโนของคุณหมดแรง!"}
function attack(){if(php<=0)return;ehp-=Math.floor(Math.random()*7)+5;updateBattle();if(ehp<=0){$("msg").textContent="ไดโนป่าอ่อนแรงแล้ว! ใช้กับดักจับมันได้";return}setTimeout(enemyTurn,350)}
function feed(){if(food<=0||php>=30||ehp<=0)return;food--;php=Math.min(30,php+10);$("msg").textContent="ใช้อาหาร ฟื้น HP 10";updateBattle();setTimeout(enemyTurn,350)}
function capture(){if(traps<=0){$("msg").textContent="กับดักหมดแล้ว";return}if(ehp>14){$("msg").textContent="HP ยังสูงเกินไป! โจมตีให้มันอ่อนแรงก่อน";return}traps--;let chance=.45+(14-ehp)*.025;if(Math.random()<chance){owned++;inBattle=false;$("battle").style.display="none";wild.x=20+Math.random()*60;wild.y=45+Math.random()*25;alert("จับไดโนเสาร์สำเร็จ! 🦖");render()}else{$("msg").textContent="จับไม่สำเร็จ!";setTimeout(enemyTurn,350)}}
function runAway(){inBattle=false;$("battle").style.display="none"}
document.addEventListener("keydown",e=>{if(inBattle)return;let k=e.key.toLowerCase();if(!["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k))return;e.preventDefault();if(k==="arrowup"||k==="w")player.y-=player.speed;if(k==="arrowdown"||k==="s")player.y+=player.speed;if(k==="arrowleft"||k==="a")player.x-=player.speed;if(k==="arrowright"||k==="d")player.x+=player.speed;player.x=Math.max(4,Math.min(96,player.x));player.y=Math.max(8,Math.min(94,player.y));render();if(dist()<8)startBattle()});$("dino").onclick=startBattle;resetGame();
</script></body></html>
